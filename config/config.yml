default: &default
  data:
    manifest: metadata/data_manifest.csv
    example: inst/extdata/austarch_example.csv
  outputs:
    dir: outputs
  compute:
    use_arrow: true
    write_parquet: true
  calibration:
    terrestrial_curve: shcal20
    marine_curve: marine20
    # Min/Max cal BP (order not important; code handles it)
    time_range: [651, 11650]
  branching:
    site:
      include: []     # optional regex patterns to include SITE names
      exclude: []     # optional regex patterns to exclude SITE names
      limit: null     # optional integer to limit number of SITE figures/branches
  report:
    site_figures:
      include: []     # optional regex patterns applied to fig file basenames
      exclude: []
      limit: 12       # how many site figures to display in the report
      montage: true   # also create a montage image from selected site figures
      ncol: 3         # number of columns in montage grid (if magick available)
  simulate:
    use_precomputed: true
    dir: data
    pattern: ^simulation_summary_.*\.csv$

testthat:
  <<: *default
