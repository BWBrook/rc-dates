default_profile: default

profiles:
  default:
    description: Radiocarbon sampling bias manuscript profile using converted artefacts.
    manuscript_sources:
      - ../manuscript/text/main.md
      - ../manuscript/text/figures.md
    lint_sources:
      - ../manuscript/text/main.md
      - ../manuscript/text/figures.md
    author_metadata: ../manuscript/authors.yaml
    bibliography: ../references/refs.yaml
    csl: ../csl/journal-of-archaeological-science.csl
    journal: Journal of Archaeological Science
    csl_search_dirs:
      - ../csl
    output_dir: dist
    output_stem: manuscript
    page_numbers: lower_right
    line_spacing: single
    line_numbering: continuous
    figures:
      placement: pages
      caption_position: top
      placeholder_id: figures
    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 2.5
      bottom: 2.0
      left: 2.5
