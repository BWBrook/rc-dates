- id: reimer2020INTCAL20NorthernHemisphere
  abstract: >-
    Radiocarbon (C-14) ages cannot provide absolutely dated chronologies for
    archaeological or paleoenvironmental studies directly but must be converted
    to calendar age equivalents using a calibration curve compensating for
    fluctuations in atmospheric C-14 concentration. Although calibration curves
    are constructed from independently dated archives, they invariably require
    revision as new data become available and our understanding of the Earth
    system improves. In this volume the international C-14 calibration curves
    for both the Northern and Southern Hemispheres, as well as for the ocean
    surface layer, have been updated to include a wealth of new data and
    extended to 55,000 cal BP. Based on tree rings, IntCal20 now extends as a
    fully atmospheric record to ca. 13,900 cal BP. For the older part of the
    timescale, IntCal20 comprises statistically integrated evidence from
    floating tree-ring chronologies, lacustrine and marine sediments,
    speleothems, and corals. We utilized improved evaluation of the timescales
    and location variable C-14 offsets from the atmosphere (reservoir age, dead
    carbon fraction) for each dataset. New statistical methods have refined the
    structure of the calibration curves while maintaining a robust treatment of
    uncertainties in the C-14 ages, the calendar ages and other corrections. The
    inclusion of modeled marine reservoir ages derived from a three-dimensional
    ocean circulation model has allowed us to apply more appropriate reservoir
    corrections to the marine C-14 data rather than the previous use of constant
    regional offsets from the atmosphere. Here we provide an overview of the new
    and revised datasets and the associated methods used for the construction of
    the IntCal20 curve and explore potential regional offsets for tree-ring
    data. We discuss the main differences with respect to the previous
    calibration curve, IntCal13, and some of the implications for archaeology
    and geosciences ranging from the recent past to the time of the extinction
    of the Neanderthals.
