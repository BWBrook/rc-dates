- id: bird2022P3k14cSyntheticGlobal
  abstract: >-
    Archaeologists increasingly use large radiocarbon databases to model
    prehistoric human demography (also termed paleo-demography). Numerous
    independent projects, funded over the past decade, have assembled such
    databases from multiple regions of the world. These data provide
    unprecedented potential for comparative research on human population ecology
    and the evolution of social-ecological systems across the Earth. However,
    these databases have been developed using different sample selection
    criteria, which has resulted in interoperability issues for global-scale,
    comparative paleo-demographic research and integration with paleoclimate and
    paleoenvironmental data. We present a synthetic, global-scale archaeological
    radiocarbon database composed of 180,070 radiocarbon dates that have been
    cleaned according to a standardized sample selection criteria. This database
    increases the reusability of archaeological radiocarbon data and streamlines
    quality control assessments for various types of paleo-demographic research.
    As part of an assessment of data quality, we conduct two analyses of
    sampling bias in the global database at multiple scales. This database is
    ideal for paleo-demographic research focused on dates-as-data, bayesian
    modeling, or summed probability distribution methodologies.
