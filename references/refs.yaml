- id: torfing2015LayersAssumptionsReply
  abstract: >-
    In a response to my paper "Neolithic population and summed probability
    distribution of C-14-dates", Timpson, Shennan, and Manning accuse me of
    making a series of inferential mistakes. Their argument is based on the
    opinion that if advanced statistical treatment of data is performed and an
    explicit null hypothesis is tested, then the argument is well founded. I
    argue that they ignore a series of underlying assumptions that connect the
    object of interest - prehistoric population - to the data they utilize
    radiocarbon dates. In my article, I explored some of the issues regarding
    these assumptions and demonstrated that it is difficult to argue that these
    assumptions are true. If the underlying assumptions are not true, or it
    cannot be established whether they are true or not, further statistical
    analysis of the data will not provide a reliable result. (C) 2015 Elsevier
    Ltd. All rights reserved.
