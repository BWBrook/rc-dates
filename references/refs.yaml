- id: stutz2025HiddenHazardsLongTerm
  abstract: "Abstract\n            This chapter considers radiocarbon-date evidence of demographic dynamics in the Epipalaeolithic of the Levant, ca. 25,000–12,000\_cal BP. The calibration analysis results reveal a millennial-scale trend, stretching over nearly 9000\_years. It involves significant long-term average demographic expansion followed by deceleration. This development is gradual, rather than abrupt. It does not appear to have been significantly affected by climatic fluctuations. This main finding highlights the robusticity of hunter-gatherer adaptability, even in the face of sporadic, otherwise archaeologically invisible, short-term hazards that inevitably impacted fertility, mortality, and migration over decadal and centennial time frames. By the end of the Last Glacial Maximum (LGM, ca. 22–19,000\_cal BP), regional human cultural systems had evolved significant resilience to natural perturbations, but something else may also have emerged. Resilient cultural institutions and built environments already in place at that time constituted social networks that stretched across strong gradients in biomass productivity. Over the long run, cultural adaptations and self-organizing demographic responses to spatial gradients in ecological productivity interacted, supporting adaptive social responses to perturbations. Increases in resource-extraction efficiency raised, in turn, culturally mediated demographic carrying capacity. Elucidating this emergent feature of coupled human–environment systems is key for understanding the root causes of long-term human demographic dynamics and environmental impacts."
