- id: becerra-valdivia2020ChallengesSampleProcessing
  abstract: >-
    For decades, researchers have employed sets of radiocarbon dates to
    reconstruct trends in ancient human populations. The overarching assumption
    in this analysis is that the frequency of dates is proportional to the
    magnitude of past human activity. Thus, the distribution of summed or
    otherwise summarized dates is used to extrapolate population density and
    mobility patterns. There are, however, a number of underlying assumptions
    associated with this analysis that workers address to varying degrees and
    which, if false and not critically accounted for, will introduce bias,
    misrepresent the magnitude of activity, and ultimately prove misleading in
    archaeological interpretations. In this regard, research has so far mainly
    focused on correcting for the effects of time-dependent degradation of
    archaeological sites and constituent materials, calibration irregularities,
    and the efficacy of the statistical methods used. Assumptions directly
    related to sample processing in radiocarbon dating, however, are less
    discussed in 'C-14-dates-as-data' analyses. It is, for example, assumed that
    all carbonaceous materials will yield sufficient, endogenous carbon for
    radiocarbon measurement. Yet sample failure in radiocarbon dating is common
    and contingent on, largely, deterministic factors such as post-depositional
    environment. Sets of radiocarbon dates analyzed, therefore, represent
    successful measurements independent of reliability. In this work, we discuss
    the biases introduced by challenges in radiocarbon processing and their
    impact on C-14-dates-as-data studies.
