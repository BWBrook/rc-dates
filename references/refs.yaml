- id: lucarini2020MedAfriCarbonRadiocarbonDatabase
  abstract: >-
    The MedAfriCarbon radiocarbon database and its accompanying web application
    are outcomes of the MedAfrica project - Archaeological deep history and
    dynamics of Mediterranean Africa, ca. 9600-700 BC. The dataset presented
    here in Version 1.0 of the database includes 1587 archaeological 14C dates
    from 368 sites in Mediterranean Africa. The database is unusual because the
    majority of the dates within it have been annotated with further cultural
    and environmental variables, notably the presence/absence of different
    domestic/wild species and particular material culture traits. MedAfriCarbon
    also includes an publicly-accessible web application that facilitates data
    exploration and informal analysis.
