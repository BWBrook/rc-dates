- id: williams2015HoloceneDemographicChanges
  abstract: >-
    A continental-scale model of Holocene Australian hunter-gatherer demography
    and mobility is generated using radiocarbon data and geospatial techniques.
    Results show a delayed expansion and settlement of much of Australia
    following the termination of the late Pleistocene until after 9,000 years
    ago (or 9ka). The onset of the Holocene climatic optimum (9-6ka) coincides
    with rapid expansion, growth and establishment of regional populations
    across similar to 75% of Australia, including much of the arid zone. This
    diffusion from isolated Pleistocene refugia provides a mechanism for the
    synchronous spread of pan-continental archaeological and linguistic
    attributes at this time (e.g. Pama-Nyungan language, Panaramitee art style,
    backed artefacts). We argue longer patch residence times were possible at
    the end of the optimum, resulting in a shift to more sedentary lifestyles
    and establishment of low-level food production in some parts of the
    continent. The onset of El Nino - Southern Oscillation (ENSO; 4.5-2ka)
    restricted low-level food production, and resulted in population
    fragmentation, abandonment of marginal areas, and reduction in ranging
    territory of similar to 26%. Importantly, climate amelioration brought about
    by more pervasive La Nina conditions (post-2ka), resulted in an
    intensification of the mobility strategies and technological innovations
    that were developed in the early- to mid-Holocene. These changes resulted in
    population expansion and utilization of the entire continent. We propose
    that it was under these demographically packed conditions that the complex
    social and religious societies observed at colonial contact were formed.
