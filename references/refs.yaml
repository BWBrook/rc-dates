- id: mendez-quiros2023ModelingLongtermHuman
  abstract: >-
    Food production is one of the most significant achievements in Andean
    history. The domestication of plants and animals presented an enormous
    challenge, relating to changing technologies, settlement patterns, and
    social organization. This paper aims to assess Atacama Desert population
    dynamics and their relationship to the domestication of plants and animals
    through chronological modeling using kernel density estimation on
    radiocarbon (C-14) dates, assuming that a higher C-14 probability density is
    related to more intense human occupation. The analysis is based on a C-14
    dataset comprising 1003 C-14 dates (between 11,000 and 150 BP) from 243
    archaeological sites in the Arica and Tarapaca regions of northern Chile,
    collected from published data. We observed two population-dynamics
    inflection points for these regions. First, starting at ca. 3000 BP,
    constant population growth occurred, which was related to horticulture in
    the Arica region and to agriculture in the Tarapaca region. Second, between
    ca. 1000 and 400 BP, a general population rise occurred due to the
    consolidation of intensive agriculture in the lowlands and precordillera
    altitudinal belts in both regions and the integration of the coast and the
    altiplano into macro-regional population dynamics.
