- id: williams2013NewPopulationCurve
  abstract: >-
    This paper presents a new reconstruction of prehistoric population of
    Australia for the last 50 ka, using the most comprehensive radiocarbon
    database currently available for the continent. The application of new
    techniques to manipulate radiocarbon data (including correction for
    taphonomic bias), gives greater reliability to the reconstructed population
    curve. This shows low populations through the Late Pleistocene, before a
    slow stepwise increase in population beginning during the Holocene
    transition (approx. 12 ka) and continuing in pulses (approx. 8.3-6.6,
    4.4-3.7 and 1.6-0.4 ka) through the Holocene. These data give no support for
    an early saturation of the continent, although the estimated population
    following initial landfall was probably greater than previously allowed
    (comparable with the Early Holocene). The greatest increase in population
    occurred in the Late Holocene, but in contrast to existing intensification
    models, changes in demography and diversification of economic activities
    began much earlier. Some demographic changes appear to be in response to
    major climatic events, most notably during the last glacial maximum, where
    the curve suggests that population fell by about 60 per cent between 21 and
    18 ka. An application of statistical demographic methods to Australian
    ethnographic and genetic data suggests that a founding group of 1000-2000 at
    50 ka would result in a population high of approximately 1.2 million at
    approximately 0.5 ka. Data suggests an 8 per cent decline to approximately
    770 000-1.1 million at the time of European contact, giving a figure
    consistent with ethnographic estimates and with historical observations of
    the impact of smallpox, and other diseases introduced by Macassans and
    Europeans during and after AD 1788.
