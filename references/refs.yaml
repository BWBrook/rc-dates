- id: wirtz2024MulticentennialCyclesContinental
  abstract: "Abstract\n            Human population dynamics and their drivers are not well understood, especially over the long term and on large scales. Here, we estimate demographic growth trajectories from 9 to 3 ka BP across the entire globe by employing summed probability distributions of radiocarbon dates. Our reconstruction reveals multicentennial growth cycles on all six inhabited continents, which exhibited matching dominant frequencies and phase relations. These growth oscillations were often also synchronised with multicentennial variations in solar activity. The growth cycle for Europe, reconstructed based on \_>91,000 radiocarbon dates, was backed by archaeology-derived settlement data and showed only a weak correlation with mean climate states, but a strong correlation with the stability of these states. We therefore suggest a link between multicentennial variations in solar activity and climate stability. This stability provided more favourable conditions for human subsistence success, and seems to have induced synchrony between regional growth cycles worldwide."
