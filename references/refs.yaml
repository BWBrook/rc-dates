- id: chaput2016RadiocarbonDatesEstimates
  abstract: >-
    Archaeological radiocarbon (C-14) dates are a fundamental source of
    information documenting patterns in paleodemographic change from prehistoric
    to modern times. Several open access databases (Canadian Archaeological
    Radiocarbon Database, Radiocarbon Palaeolithic Europe Database, CONTEXT,
    RAdiocarbon Dates ONline, and AustArch) and publications which include lists
    of dates provide easy access to archaeological C-14 data, presently
    totalling over 70,000 dates worldwide. Some parts of the world are more
    extensively sampled than others including North America, Australia and
    China, whereas in others the databases have not yet been prepared. A
    comparison of frequency distributions of C-14 dates from North America and
    Australia to modeled estimates of historical population growth for these
    continents from the HYDE 3.1 database shows similarities, providing
    confidence in long-term estimates of population growth using both methods.
    Our capacity to study global demographic change is currently limited by the
    spatiotemporal completeness of regional C-14 databases. These results
    suggest the systematic collection and entry of dates into an
    openly-accessible, global C-14 database will allow for significant advances
    to be made in archaeology, anthropology and Quaternary paleogeography. (C)
    2015 Elsevier Ltd. All rights reserved.
