- id: michczynska2007FrequencyDistributionRadiocarbon
  abstract: >-
    Large sets of radiocarbon dates of 1019 peat, 155 speleothem, and 100 tufa
    samples, as well as dates of 330 fluvial samples, were investigated in order
    to estimate environmental variability during the last 16,000 calendar years
    in Poland. All C-14 dating was carried out in the Gliwice Radiocarbon
    Laboratory, and results are stored in the RoS database. Probability density
    functions (PDFs) were created by summing up (on the calendar timescale)
    individual age probability distributions of all dates for different types of
    material and for different regions of Poland. We used an updated version of
    the Gliwice Radiocarbon Laboratory calibration program GdCALIB. The C-14
    dates were calibrated using the IntCal04 calibration curve (Reimer et al.
    2004), and results were compared with other paleoenvironmental records. The
    authors conclude that analyzing PDFs of different types of sediments can be
    helpful in the qualitative reconstruction of the past environment. The PDF
    for peat samples primarily reflects paleohydrological conditions; the PDFs
    for speleothem and tufa samples reflect changes in temperature and humidity,
    while analysis of the PDF created for fluvial data is in a general agreement
    with the PDFs constructed for peat samples.
