- id: demjan2016ModellingDistributionArchaeological
  abstract: >-
    We analyse variations in prehistoric agricultural settlement behaviour both
    in space and time to detect main turning points and shifts in settlement
    patterns in Bohemia, western Czech Republic. We propose a theoretical
    framework to address our research question and a new evidence density
    estimation (EDE) method combining and extending existing approaches to
    produce probabilistic maps and temporal frequency distribution (TFD) curves.
    This method takes into account heterogeneous spatial and temporal accuracy
    of archaeological data, and it models settlement structure where respective
    sites have a specific area and a given interval of duration. We determined
    minimal sampling densities of archaeological data enabling the method to
    predict prehistoric settlement at a statistically significant level. The EDE
    method is universally applicable for all datasets with sampling densities of
    more than 0.05 archaeological actions per km(2) for chrono-typologically
    dated evidence and 0.035 actions per km(2) for radiocarbon or similar dates.
    The results show that changes in spatial extent, density and clustering of
    settlement activities occur repeatedly throughout the whole agricultural
    prehistory and shed new light on settlement behaviour of past populations.
    (C) 2016 Elsevier Ltd. All rights reserved.
