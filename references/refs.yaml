- id: eren2012EstimatingRichnessPopulation
  abstract: >-
    Background: Estimating assemblage species or class richness from samples
    remains a challenging, but essential, goal. Though a variety of statistical
    tools for estimating species or class richness have been developed, they are
    all singly-bounded: assuming only a lower bound of species or classes.
    Nevertheless there are numerous situations, particularly in the cultural
    realm, where the maximum number of classes is fixed. For this reason, a new
    method is needed to estimate richness when both upper and lower bounds are
    known. Methodology/Principal Findings: Here, we introduce a new method for
    estimating class richness: doubly-bounded confidence intervals (both lower
    and upper bounds are known). We specifically illustrate our new method using
    the Chao1 estimator, rarefaction, and extrapolation, although any estimator
    of asymptotic richness can be used in our method. Using a case study of
    Clovis stone tools from the North American Lower Great Lakes region, we
    demonstrate that singly-bounded richness estimators can yield confidence
    intervals with upper bound estimates larger than the possible maximum number
    of classes, while our new method provides estimates that make empirical
    sense. Conclusions/Significance: Application of the new method for
    constructing doubly-bound richness estimates of Clovis stone tools permitted
    conclusions to be drawn that were not otherwise possible with singly-bounded
    richness estimates, namely, that Lower Great Lakes Clovis Paleoindians
    utilized a settlement pattern that was probably more logistical in nature
    than residential. However, our new method is not limited to archaeological
    applications. It can be applied to any set of data for which there is a
    fixed maximum number of classes, whether that be site occupancy models,
    commercial products (e. g. athletic shoes), or census information (e. g.
    nationality, religion, age, race).
