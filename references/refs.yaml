- id: surovell2009CorrectingTemporalFrequency
  abstract: >-
    In this paper, we expand upon a prior study [Surovell, T.A., Brantingham,
    P.J., 2007. A note on the use of temporal frequency distributions in studies
    of prehistoric demography. journal of Archaeological Science 34,1868-1877.]
    that explored the problem of taphonomic bias. Taphonomic bias refers to the
    tendency for younger things to be over-represented relative to older things
    in the archaeological record due to the operation of destructive processes
    like erosion and weathering. Using a database of radiocarbon dated volcanic
    deposits from Bryson, R.U., Bryson, RA., Ruter, A. [2006. A calibrated
    radiocarbon database of late Quaternary volcanic eruptions. Earth
    Discussions 1, 123-124.], we develop an empirical model of taphonomic bias.
    In contrast to our prior study in which we modeled taphonomic bias as an
    exponential function wherein the likelihood of site loss remains constant
    through time, we argue that the probability of site destruction actually
    decreases with site age. We further demonstrate how this model can be used
    to correct temporal frequency distributions and extract demographic
    histories. We illustrate this approach using databases of radiocarbon dates
    from rockshelter and open-air sites in the Bighorn Basin, Wyoming, USA, and
    mammoths and humans in Siberia, Russia. (C) 2009 Elsevier Ltd. All rights
    reserved.
