- id: freeman2018CultureProcessInterpretation
  abstract: >-
    Over the last decade, archaeologists have turned to large radiocarbon (C-14)
    data sets to infer prehistoric population size and change. An outstanding
    question concerns just how direct of an estimate C-14 dates are for human
    populations. In this paper we propose that C-14 dates are a better estimate
    of energy consumption, rather than an unmediated, proportional estimate of
    population size. We use a parametric model to describe the relationship
    between population size, economic complexity and energy consumption in human
    societies, and then parametrize the model using data from modern contexts.
    Our results suggest that energy consumption scales sub-linearly with
    population size, which means that the analysis of a large C-14 time-series
    has the potential to misestimate rates of population change and absolute
    population size. Energy consumption is also an exponential function of
    economic complexity. Thus, the C-14 record could change semi-independent of
    population as complexity grows or declines. Scaling models are an important
    tool for stimulating future research to tease apart the different effects of
    population and social complexity on energy consumption, and explain
    variation in the forms of C-14 date time-series in different regions.
